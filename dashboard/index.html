<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FocusStream</title>
  <link rel="stylesheet" href="timeline.css">
</head>
<body>
  <header>
    <h1>FocusStream</h1>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="Search title or URL…" autocomplete="off">
      <div id="search-results" hidden></div>
    </div>
    <span class="note" id="count">loading…</span>
    <button id="scores">Score table</button>
    <button id="clear">Clear data</button>
  </header>
  <div id="ribbon-wrap">
    <div id="ribbon"></div>
    <div id="ribbon-empty" hidden>No sessions on this day.</div>
  </div>
  <!-- type="module" required since 2026-08-21: transit.js gained named
       exports when background.js became a module worker, and `export` is a
       syntax error in a classic script — the file failed to parse, so its
       globalThis.FS_TRANSIT assignment never ran and assembly.js threw at
       module-eval. Module scripts are deferred, but so are the two below,
       and they execute in document order, so FS_TRANSIT is still set first. -->
  <script type="module" src="../shared/transit.js"></script>
  <script type="module" src="timeline.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
