<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FocusStream</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #fafafa;
      color: #222;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #ddd;
      background: #fff;
      position: sticky;
      top: 0;
    }
    h1 { font-size: 16px; margin: 0; }
    /* Day paging (spec §6): ‹ today › — buttons disable at the bounds
       (oldest stored day / today). */
    #day-nav { display: flex; align-items: center; gap: 4px; align-self: center; }
    #day-nav button { width: 26px; }
    #day-nav button:disabled { opacity: 0.4; }
    #day-label {
      font-size: 13px;
      font-weight: 600;
      min-width: 7.5em;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    header .note { color: #888; font-size: 12px; flex: 1; }
    button { font-size: 12px; }
    ol { list-style: none; margin: 0; padding: 8px 16px; }
    li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 3px 4px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      white-space: nowrap;
    }
    li.dim { opacity: 0.45; }
    li.live { background: #fffbe6; }
    .time { color: #888; font-variant-numeric: tabular-nums; width: 8.5em; }
    .dur { color: #555; font-variant-numeric: tabular-nums; width: 4.5em; text-align: right; }
    .favicon { width: 14px; height: 14px; align-self: center; }
    a.title {
      color: #1a56b0;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 34em;
    }
    a.title:hover { text-decoration: underline; }
    .signals { color: #0a7a3d; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .meta { color: #999; font-size: 12px; }
    #empty { color: #888; padding: 24px 16px; }
    /* Indent plain rows to align with visit summaries (arrow width + gap) */
    #timeline > li:not(.visit) { padding-left: 22px; }
    /* Visit rows: consecutive same-hostname sessions grouped behind <details> */
    li.visit { display: block; padding: 0; }
    li.visit > details > summary {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 3px 4px;
      cursor: pointer;
      list-style: none;
    }
    li.visit > details > summary::-webkit-details-marker { display: none; }
    .arrow { color: #888; font-size: 10px; width: 10px; display: inline-block; }
    details[open] > summary .arrow { transform: rotate(90deg); }
    .label { font-weight: 600; }
    li.visit ol { padding: 0 0 4px 34px; }
    li.visit ol li { border-bottom: none; border-top: 1px dotted #e5e5e5; }
    /* Horizontal timeline ribbon (spec §6): dark holodeck panel, subtle grid.
       Width = time, height = tier, hue = hostname. */
    #ribbon-wrap {
      background: #14161a;
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 40px 40px;
      overflow-x: auto;
      border-bottom: 1px solid #ccc;
      padding: 8px 16px;
    }
    #ribbon { position: relative; min-width: 100%; }
    #ribbon-empty { color: rgba(255,255,255,0.5); font-size: 13px; padding: 24px 4px; }
    .blk {
      position: absolute;
      box-sizing: border-box;
      border: 1px solid;
      border-radius: 2px;
      cursor: pointer;
      transition: left 0.3s, width 0.3s, top 0.3s, height 0.3s;
    }
    /* Lit up, not recolored: a strong brightness filter made dark palette
       entries impersonate their light neighbors (identity is sacred). */
    .blk:hover { filter: brightness(1.15); box-shadow: 0 0 8px 2px rgba(255,255,255,0.35); }
    /* Containers (spec §6): a 25% wash of the host color with the identity
       carried by a 2px full-strength border — children sit on near-dark
       ground, so the palette's dark-bg contract holds inside. Hover lifts
       the wash instead of brightening, keeping the children stable. */
    .blk.cont {
      background: color-mix(in srgb, var(--host) 25%, transparent);
      border-width: 2px;
    }
    .blk.cont:hover {
      background: color-mix(in srgb, var(--host) 35%, transparent);
      filter: none;
      box-shadow: none;
    }
    .plate { position: absolute; cursor: pointer; }
    .plate:hover { background: rgba(255,255,255,0.08); }
    /* Gap region (spec §6 gap hours): hover reveals the away-span tooltip;
       a whisper of background so the hover feels acknowledged. */
    .gap { position: absolute; }
    .gap:hover { background: rgba(255,255,255,0.04); }
    /* Collapse target: a 16px invisible hit zone; the 4px visual bar is
       drawn by ::after, sitting BAR_GAP below the band. */
    .xbar {
      position: absolute;
      height: 16px;
      cursor: pointer;
    }
    .xbar::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      top: 4px;
      height: 4px;
      background: rgba(255,255,255,0.45);
      border-radius: 2px;
    }
    .xbar:hover::after { background: rgba(255,255,255,0.75); }
    .tick { position: absolute; width: 1px; background: #fff; }
    .hlabel {
      position: absolute;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .rtitle {
      position: absolute;
      font-size: 14px;
      line-height: 16px; /* fixed: timeline.js anchors label bottoms with it */
      white-space: nowrap;
      transform: rotate(-90deg);
      transform-origin: 0 100%;
    }
    /* Custom tooltip (spec §6): uniform delay, ribbon aesthetic, and the
       future mount point for snapshot previews. pointer-events: none so it
       can never steal the hover that opened it. */
    #tip {
      position: fixed;
      z-index: 10;
      max-width: 480px;
      background: #1e2126;
      border: 1px solid #454b55;
      border-radius: 4px;
      padding: 8px 10px;
      color: #d8dce2;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: break-word;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <header>
    <h1>FocusStream</h1>
    <nav id="day-nav">
      <button id="day-prev" title="Previous day">&lsaquo;</button>
      <span id="day-label">Today</span>
      <button id="day-next" title="Next day">&rsaquo;</button>
    </nav>
    <span class="note" id="count">loading…</span>
    <button id="scores">Score table</button>
    <button id="refresh">Refresh</button>
    <button id="clear">Clear data</button>
  </header>
  <div id="ribbon-wrap">
    <div id="ribbon"></div>
    <div id="ribbon-empty" hidden>No sessions on this day.</div>
  </div>
  <ol id="timeline"></ol>
  <div id="empty" hidden>No sessions recorded yet.</div>
  <script src="timeline.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
