<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FocusStream</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #14161a;
      color: #d8dce2;
      color-scheme: dark; /* native controls (buttons, scrollbars) go dark too */
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 12px 16px;
      background: #1a1d22;
      position: sticky;
      top: 0;
      /* Own stacking context sits above #week-strip in paint order; without
         this the search dropdown's z-index only wins within header's own
         context and week-strip's cells (later in document order) paint over
         it (2026-08-06). */
      z-index: 5;
    }
    /* Title left; session count + debug buttons cluster right (the week
       strip below is the only day picker — spec §6, 2026-07-17). */
    h1 { font-size: 16px; margin: 0; flex: 1; }
    header .note { color: #888; font-size: 12px; }
    button { font-size: 12px; }
    /* Search (2026-08-06): title/url substring search over the full stored
       week, independent of day paging and the ribbon — a "find and go"
       tool, not a ribbon filter (see plans/ for the rejected ribbon-highlight
       alternatives). Dropdown is positioned relative to this wrapper. */
    #search-wrap { position: relative; }
    #search {
      font-size: 12px;
      padding: 4px 8px;
      width: 220px;
      background: #14161a;
      border: 1px solid #3a4048;
      border-radius: 3px;
      color: #d8dce2;
    }
    #search:focus { outline: none; border-color: #5a636e; }
    #search-results {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 360px;
      max-height: 320px;
      overflow-y: auto;
      background: #1e2126;
      border: 1px solid #454b55;
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 20;
    }
    .sr-row {
      display: block;
      padding: 6px 10px;
      cursor: pointer;
      color: #d8dce2;
      text-decoration: none;
    }
    .sr-row:hover, .sr-row.active { background: rgba(255,255,255,0.08); }
    .sr-title {
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sr-meta { font-size: 11px; color: #9aa1ab; margin-top: 1px; }
    .sr-empty { padding: 8px 10px; font-size: 12px; color: #878d97; }
    /* Week strip (spec §6, 2026-07-17): one skyline cell per stored day —
       the ribbon's importance contour on linear time. Bars paint by
       importance, not identity (spec §6, 2026-08-07): unimportant/important
       luminance pair by band, gold border on earned-HIGH. Click a cell to
       jump day paging there. */
    /* Header + strip share one slightly-lighter band; the ribbon below sits
       on the plain page ground with no separating borders. */
    #week-strip {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 16px 12px;
      background: #1a1d22;
      overflow-x: auto;
    }
    .wday { cursor: pointer; flex: none; }
    .wday-label {
      font-size: 11px;
      color: rgba(255,255,255,0.75);
      margin-bottom: 3px;
      font-variant-numeric: tabular-nums;
    }
    .wday-sky {
      position: relative;
      box-sizing: border-box;
      background: rgba(255,255,255,0.04);
      border: 1px solid #3a4048;
      border-radius: 3px;
      /* Reserves room for the selected outline (below) so bars — positioned
         against this box's padding edge — never sit under it. Constant
         regardless of selection, so content never shifts on select. */
      padding: 2px;
    }
    .wday:hover .wday-sky { border-color: #5a636e; }
    /* Outline, not border: outline draws outside the box without affecting
       layout, so the selected day's content never shifts (border-width
       swaps were nudging the box even under box-sizing: border-box). */
    .wday.selected .wday-sky {
      border-color: #d0d4da;
      outline: 3px solid #d0d4da;
      outline-offset: -1px;
    }
    .wbar {
      position: absolute;
      bottom: 0;
      box-sizing: border-box;
      border: 1px solid;
      border-radius: 2px;
    }
    /* Horizontal timeline ribbon (spec §6): dark holodeck panel — no grid,
       a uniform grid would imply a uniform time scale.
       Width = time, height = tier, luminance = importance, favicon = identity
       (2026-08-07 monochrome pass — hue identity retired). */
    #ribbon-wrap {
      background: #14161a;
      overflow-x: auto;
      padding: 8px 16px;
    }
    #ribbon { position: relative; min-width: 100%; }
    #ribbon-empty { color: rgba(255,255,255,0.5); font-size: 13px; padding: 24px 4px; }
    .blk {
      position: absolute;
      box-sizing: border-box;
      border: 1px solid;
      border-radius: 2px;
      cursor: pointer;
      /* Clips the favicon on blocks too narrow/short to fit it (spec §6,
         2026-08-07 always-attempt experiment) — a partial icon beats none. */
      overflow: hidden;
      transition: left 0.3s, width 0.3s, top 0.3s, height 0.3s;
    }
    /* Lit up, not recolored: a strong brightness filter made dark palette
       entries impersonate their light neighbors (identity is sacred). */
    .blk:hover { filter: brightness(1.15); box-shadow: 0 0 8px 2px rgba(255,255,255,0.35); }
    /* Contained children (spec §6, 2026-07-17): cut out of the container's
       solid interior by a page-background seam — the container itself paints
       like any other HIGH block. Border narrowed 2px -> 1px (2026-08-02) to
       cut a less heavy seam. */
    .blk.cut { border-width: 1px; }
    /* Earned-HIGH (spec §6, 2026-08-07): a container/block whose OWN thread
       reached HIGH via one individually-HIGH fragment, not by summing
       lesser ones — the gold accent border color (EARNED_RIM) is set
       directly in JS; the .earned-high class is kept as a hook for the
       hover/hit-testing code even though no rule targets it here. */
    /* Favicon (spec §6, 2026-08-07; always-color/always-attempt experiment
       same day): drawn on every real block, always full color — grayscale
       dimming made them unreadable and didn't help identify the visit.
       Anchored top-left and left un-shrunk; .blk's own overflow:hidden
       clips it on blocks too narrow/short to fit the full 16px icon, so a
       partial icon beats none. Experimental: may look bad on very thin
       blocks. */
    .blk .fav {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .plate { position: absolute; cursor: pointer; }
    .plate:hover { background: rgba(255,255,255,0.08); }
    /* Gap region (spec §6 gap hours): hover reveals the away-span tooltip;
       a whisper of background so the hover feels acknowledged. */
    .gap { position: absolute; }
    .gap:hover { background: rgba(255,255,255,0.04); }
    /* Collapse target: a 16px invisible hit zone; the 4px visual bar is
       drawn by ::after, sitting BAR_GAP below the band. */
    .xbar {
      position: absolute;
      height: 16px;
      cursor: pointer;
    }
    .xbar::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      top: 4px;
      height: 4px;
      background: rgba(255,255,255,0.45);
      border-radius: 2px;
    }
    .xbar:hover::after { background: rgba(255,255,255,0.75); }
    .tick { position: absolute; width: 1px; background: #fff; }
    .hlabel {
      position: absolute;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .rtitle {
      position: absolute;
      font-size: 14px;
      line-height: 16px; /* fixed: timeline.js anchors label bottoms with it */
      white-space: nowrap;
      transform: rotate(-90deg);
      transform-origin: 0 100%;
      /* Glide with the blocks (same 0.3s as .blk); opacity handles the
         fade-in of fence-member titles and the fade-out of departed ones. */
      transition: left 0.3s, opacity 0.3s;
    }
    /* Custom tooltip (spec §6): uniform delay, ribbon aesthetic, and the
       future mount point for snapshot previews. pointer-events: none so it
       can never steal the hover that opened it. */
    #tip {
      position: fixed;
      z-index: 10;
      max-width: 480px;
      background: #1e2126;
      border: 1px solid #454b55;
      border-radius: 4px;
      padding: 8px 10px;
      color: #d8dce2;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: break-word;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    /* Snapshot preview (spec §6): revealed only after decode, so the tooltip
       is measured at its final size. max-width bounds the 640px capture to
       the tooltip's own cap. */
    #tip-img {
      display: block;
      max-width: 100%;
      border-radius: 3px;
      margin-bottom: 6px;
    }
    /* Two-section tooltip (spec §6, 2026-07-18): bold site name, muted
       meta, pages sorted by score with LOW pages dimmed (the ribbon's
       brightness-equals-tier vocabulary); everything mechanical sits in
       .tip-debug — smaller, grayer, ruled off, gated by TIP_DEBUG. */
    #tip .tip-title { font-weight: 600; font-size: 13px; }
    #tip .tip-meta { color: #9aa1ab; }
    /* One line per page: the title span ellipsizes, the score span (debug)
       keeps its width — long titles never wrap and never eat the score. */
    #tip .tip-page {
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }
    #tip .tip-page .t {
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    #tip .dim { color: #878d97; }
    #tip .tip-debug {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #353a42;
      color: #8b919b;
      font-size: 11px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <header>
    <h1>FocusStream</h1>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="Search title or URL…" autocomplete="off">
      <div id="search-results" hidden></div>
    </div>
    <span class="note" id="count">loading…</span>
    <button id="scores">Score table</button>
    <button id="refresh">Refresh</button>
    <button id="clear">Clear data</button>
  </header>
  <div id="week-strip" hidden></div>
  <div id="ribbon-wrap">
    <div id="ribbon"></div>
    <div id="ribbon-empty" hidden>No sessions on this day.</div>
  </div>
  <script src="../shared/transit.js"></script>
  <script src="timeline.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
